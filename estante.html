<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estante</title>
</head>
<body>
    <link rel="stylesheet" href="style.css">
    <header>
      <main class="menu2">
    
      </main>
      <h1>Meus Livros favoritos</h1>
    </header>
  

    <input id="livro" placeholder="Título do livro">
    <button onclick="adicionarLivro()">Adicionar</button>

    <ul id="lista"></ul>

    <script> 
      let livros = JSON.parse(localStorage.getItem('livros')) || [];

      function mostrarLivros(){
      const lista = document.getElementById('lista');
      lista.innerHTML = ''; 
      livros.forEach((livro, i) => {
      lista.innerHTML += `<li>${livro} <button onclick="removerLivro(${i})">x</button></li>`;
      });
      }

      function adicionarLivro(){
        const titulo = document.getElementById('livro').value.trim();
        if (titulo) {
            livros.push(titulo);
            localStorage.setItem('livros', JSON.stringify(livros));
            document.getElementById('livro').value = '';
            mostrarLivros();
        }
      }
      function removerLivro(i){
      livros.splice(i,1);
      localStorage.setItem('livros', JSON.stringify(livros));
      mostrarLivros();
      }
      mostrarLivros();

    </script>

</body>
