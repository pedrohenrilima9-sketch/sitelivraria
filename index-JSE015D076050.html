<script>
function procurar() {
  let texto = 
  document.getElementById("busca").value.toLowerCase();

  let livros = {
    "Livros de Ação": "ação.html",
    "Livros de Fantasia":"fantasia.html",
    "Livros de Terror":"terror.html",
    "Livros de Romance":"romance.html",
    "Livros de RomanceLGBT":"romancelgbt.html",
    "Livros de Distopia": "distopia.html",
    "Livros de Suspense": "suspense.html",
  };
  
  for (let nome in livros) {
    if (nome.toLowerCase().includes(texto)) {
      window.location.href = livros[nome];
      return;
    }
  }
  alert("Livro não encontrado!");
}

</script>
